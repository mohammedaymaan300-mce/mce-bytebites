<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEBITES - Kitchen Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f2f0ea] text-neutral-900 font-sans min-h-screen p-4 sm:p-8">

    <!-- Staff Login Gate Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-neutral-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white border border-neutral-200 p-6 rounded-3xl w-full max-w-sm space-y-5 shadow-2xl">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h2 class="text-lg font-black text-neutral-900">Kitchen Staff Login</h2>
                <p class="text-xs text-neutral-500">Authorized Personnel Only</p>
            </div>
            <form id="staff-login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-neutral-700">Staff ID (e.g. MCEBB001)</label>
                    <input type="text" id="staff-id" required class="w-full p-3 rounded-xl border border-neutral-300 bg-neutral-50 text-sm focus:ring-2 focus:ring-amber-500 outline-none uppercase font-bold">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-neutral-700">Password</label>
                    <input type="password" id="staff-pass" required class="w-full p-3 rounded-xl border border-neutral-300 bg-neutral-50 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 text-neutral-950 font-extrabold rounded-xl shadow-lg hover:bg-amber-400 transition text-sm">Secure Staff Login</button>
            </form>
        </div>
    </div>

    <!-- Kitchen Dashboard Container -->
    <div id="dashboard-container" class="w-full max-w-5xl mx-auto space-y-6" style="display: none;">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-neutral-300 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-600">MCE Kitchen Dashboard</h1>
                <p class="text-xs text-neutral-500">Staff ID: <span id="display-staff-id" class="font-bold text-neutral-800"></span></p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openDeliveredModal()" class="px-4 py-2.5 bg-neutral-900 text-white hover:bg-neutral-800 text-xs font-extrabold rounded-xl flex items-center space-x-2 shadow transition">
                    <i class="fa-solid fa-box-archive text-amber-400"></i>
                    <span>Delivered Orders</span>
                    <span id="badge-delivered-count" class="bg-amber-500 text-neutral-950 px-1.5 py-0.5 rounded-full text-[10px] font-black">0</span>
                </button>
                <button onclick="fetchOrders()" class="px-4 py-2.5 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs font-bold rounded-xl flex items-center space-x-2 transition">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Refresh</span>
                </button>
                <button onclick="staffLogout()" class="px-4 py-2.5 bg-red-100 hover:bg-red-200 text-red-600 text-xs font-bold rounded-xl transition">Logout</button>
            </div>
        </header>

        <!-- Summary Metrics Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm">
                <p class="text-[11px] text-neutral-500 font-medium">Active Queue</p>
                <p id="metric-active-orders" class="text-xl font-black text-neutral-900">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm">
                <p class="text-[11px] text-neutral-500 font-medium">Preparing</p>
                <p id="metric-preparing" class="text-xl font-black text-amber-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm">
                <p class="text-[11px] text-neutral-500 font-medium">Total Delivered</p>
                <p id="metric-delivered" class="text-xl font-black text-green-600">0</p>
            </div>
            <div class="bg-amber-500 text-neutral-950 p-4 rounded-2xl shadow-md">
                <p class="text-[11px] font-bold opacity-90">Total Canteen Revenue</p>
                <p id="metric-income" class="text-xl font-black">₹0</p>
            </div>
        </div>

        <!-- Active Queue Container -->
        <div id="kitchen-orders-list" class="grid grid-cols-1 gap-5"></div>
    </div>

    <!-- Delivered Orders Archive Modal -->
    <div id="delivered-modal" class="fixed inset-0 bg-neutral-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white border border-neutral-200 rounded-3xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-neutral-200 flex justify-between items-center bg-neutral-50">
                <div>
                    <h3 class="font-black text-lg text-neutral-900 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-green-600"></i> Delivered Orders Archive
                    </h3>
                    <p class="text-xs text-neutral-500">History of completed and served student orders</p>
                </div>
                <button onclick="closeDeliveredModal()" class="w-8 h-8 bg-neutral-200 hover:bg-neutral-300 rounded-full text-xs font-bold flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="delivered-list-container" class="p-5 overflow-y-auto space-y-3 flex-1"></div>
        </div>
    </div>

    <script>
        const validStaffIDs = ["MCEBB001", "MCEBB002", "MCEBB003", "MCEBB004"];
        const staffPassword = "MCEBB@1960";
        let pollInterval = null;
        let allOrdersCache = [];

        document.addEventListener("DOMContentLoaded", () => {
            const loggedIn = localStorage.getItem('kitchen_logged_in');
            const currentStaff = localStorage.getItem('current_staff_id');

            if (loggedIn === 'true' && validStaffIDs.includes(currentStaff)) {
                showDashboard(currentStaff);
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }

            document.getElementById('staff-login-form').onsubmit = (e) => {
                e.preventDefault();
                const idInput = document.getElementById('staff-id').value.trim().toUpperCase();
                const passInput = document.getElementById('staff-pass').value.trim();

                if (validStaffIDs.includes(idInput) && passInput === staffPassword) {
                    localStorage.setItem('kitchen_logged_in', 'true');
                    localStorage.setItem('current_staff_id', idInput);
                    showDashboard(idInput);
                } else {
                    alert("Invalid Staff ID or Password!");
                }
            };
        });

        function showDashboard(staffId) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';
            document.getElementById('display-staff-id').innerText = staffId;
            fetchOrders();
            clearInterval(pollInterval);
            pollInterval = setInterval(fetchOrders, 4000);
        }

        function staffLogout() {
            localStorage.removeItem('kitchen_logged_in');
            localStorage.removeItem('current_staff_id');
            clearInterval(pollInterval);
            document.getElementById('dashboard-container').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                allOrdersCache = await res.json();
                renderKitchenDashboard(allOrdersCache);
            } catch (e) { console.error("Error fetching orders", e); }
        }

        function renderKitchenDashboard(orders) {
            const activeOrders = orders.filter(o => o.statusStage !== 2); // 2 = Delivered / Ready
            const deliveredOrders = orders.filter(o => o.statusStage === 2);

            // Update Metrics
            document.getElementById('metric-active-orders').innerText = activeOrders.length;
            document.getElementById('metric-preparing').innerText = orders.filter(o => o.statusStage === 1).length;
            document.getElementById('metric-delivered').innerText = deliveredOrders.length;
            document.getElementById('badge-delivered-count').innerText = deliveredOrders.length;

            const totalRevenue = orders.reduce((sum, ord) => sum + (ord.total || 0), 0);
            document.getElementById('metric-income').innerText = '₹' + totalRevenue;

            const container = document.getElementById('kitchen-orders-list');
            if (activeOrders.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-12 text-center border border-neutral-200 shadow-sm"><p class="text-neutral-400 text-sm font-bold">No active orders in preparation queue.</p></div>`;
                return;
            }

            container.innerHTML = activeOrders.map(ord => {
                const isCash = ord.payment && ord.payment.toLowerCase().includes('cash');
                const boxBg = isCash 
                    ? 'bg-white border-2 border-neutral-300 text-neutral-900' 
                    : 'bg-neutral-950 border border-neutral-800 text-white';

                return `
                <div class="${boxBg} rounded-3xl p-6 space-y-5 shadow-xl transition-all">
                    <!-- Top Bar: Red 40px Order ID & Status Badge -->
                    <div class="flex justify-between items-start border-b border-neutral-200/20 pb-4">
                        <div>
                            <span class="text-[40px] font-black leading-none text-red-600 block tracking-tight">${ord.id}</span>
                            <h3 class="font-extrabold text-lg mt-1">${ord.studentName}</h3>
                            <p class="text-xs opacity-75 font-semibold">${ord.usn} • Sec ${ord.sec} • ${ord.time}</p>
                        </div>
                        <span class="text-xs font-extrabold px-3.5 py-1.5 rounded-xl ${ord.statusStage === 1 ? 'bg-amber-500 text-neutral-950' : 'bg-blue-600 text-white'}">
                            ${ord.statusStage === 1 ? 'Preparing' : 'Received'}
                        </span>
                    </div>

                    <!-- Food Items (Size 18px / text-lg) -->
                    <div class="space-y-2 py-1">
                        ${ord.items.map(i => `
                            <div class="flex justify-between items-center text-lg font-bold">
                                <span>• ${i.name}</span>
                                <span class="font-black text-amber-500">₹${i.price}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Payment Details Footer -->
                    <div class="pt-4 border-t border-neutral-200/20 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] opacity-60 font-black uppercase tracking-wider">Payment Mode</p>
                            <p class="text-base font-extrabold">${ord.payment || 'Online UPI / QR'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] opacity-60 font-black uppercase tracking-wider">Total Amount</p>
                            <p class="text-2xl font-black text-red-600">₹${ord.total}</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3 pt-2">
                        <button onclick="updateOrderStatus('${ord.id}', 1)" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-neutral-950 font-black text-sm rounded-2xl transition shadow-lg">
                            Mark Preparing
                        </button>
                        <button onclick="updateOrderStatus('${ord.id}', 2)" class="flex-1 py-3 bg-green-600 hover:bg-green-500 text-white font-black text-sm rounded-2xl transition shadow-lg">
                            Mark Ready & Deliver
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function updateOrderStatus(id, stage) {
            try {
                const res = await fetch(`/api/orders/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statusStage: stage })
                });
                if (res.ok) fetchOrders();
            } catch (e) { alert("Failed to update order status."); }
        }

        function openDeliveredModal() {
            const deliveredOrders = allOrdersCache.filter(o => o.statusStage === 2);
            const container = document.getElementById('delivered-list-container');

            if (deliveredOrders.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-neutral-400 text-sm font-semibold">No delivered orders yet.</p>`;
            } else {
                container.innerHTML = deliveredOrders.map(ord => `
                    <div class="bg-neutral-50 border border-neutral-200 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="text-base font-black text-red-600">${ord.id}</span>
                            <p class="text-xs font-bold text-neutral-800">${ord.studentName} (${ord.usn})</p>
                            <p class="text-[10px] text-neutral-400">${ord.items.length} items • ${ord.time}</p>
                        </div>
                        <div class="text-right">
                            <span class="px-2.5 py-1 bg-green-100 text-green-700 font-extrabold rounded-lg text-xs">Delivered</span>
                            <p class="text-sm font-black text-neutral-900 mt-1">₹${ord.total}</p>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('delivered-modal').style.display = 'flex';
        }

        function closeDeliveredModal() {
            document.getElementById('delivered-modal').style.display = 'none';
        }
    </script>
</body>
</html>
