<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEBITES - Kitchen Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#fbf9f4] text-neutral-900 font-sans min-h-screen p-4 sm:p-8">

    <!-- Staff Login Gate Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-neutral-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white border border-neutral-200 p-6 rounded-3xl w-full max-w-sm space-y-5 shadow-2xl">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h2 class="text-lg font-black text-neutral-900">Kitchen Staff Login</h2>
                <p class="text-xs text-neutral-500">Authorized Personnel Only</p>
            </div>
            <form id="staff-login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-neutral-700">Staff ID (e.g. MCEBB001)</label>
                    <input type="text" id="staff-id" required class="w-full p-3 rounded-xl border border-neutral-300 bg-neutral-50 text-sm focus:ring-2 focus:ring-amber-500 outline-none uppercase font-bold">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-neutral-700">Password</label>
                    <input type="password" id="staff-pass" required class="w-full p-3 rounded-xl border border-neutral-300 bg-neutral-50 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 text-neutral-950 font-extrabold rounded-xl shadow-lg hover:bg-amber-400 transition text-sm">Secure Staff Login</button>
            </form>
        </div>
    </div>

    <!-- Kitchen Dashboard Container -->
    <div id="dashboard-container" class="w-full max-w-5xl mx-auto space-y-6" style="display: none;">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-neutral-300 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-600">MCE Kitchen Dashboard</h1>
                <p class="text-xs text-neutral-500">Staff ID: <span id="display-staff-id" class="font-bold text-neutral-800"></span></p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="switchTab('active')" id="tab-active-btn" class="px-4 py-2 bg-amber-500 text-neutral-950 text-xs font-extrabold rounded-xl shadow">Active Queue</button>
                <button onclick="switchTab('delivered')" id="tab-delivered-btn" class="px-4 py-2 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs font-bold rounded-xl transition">Delivered History</button>
                <button onclick="fetchOrders()" class="px-4 py-2 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Refresh</span>
                </button>
                <button onclick="staffLogout()" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-600 text-xs font-bold rounded-xl transition">Logout</button>
            </div>
        </header>

        <!-- Metrics & Summary Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm text-neutral-900">
                <p class="text-[11px] text-neutral-500 font-medium">Total Orders</p>
                <p id="metric-total-orders" class="text-xl font-black">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm text-neutral-900">
                <p class="text-[11px] text-neutral-500 font-medium">Preparing</p>
                <p id="metric-preparing" class="text-xl font-black text-amber-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-neutral-200 shadow-sm text-neutral-900">
                <p class="text-[11px] text-neutral-500 font-medium">Ready</p>
                <p id="metric-ready" class="text-xl font-black text-green-600">0</p>
            </div>
            <div class="bg-amber-500 text-neutral-950 p-4 rounded-2xl shadow-md">
                <p class="text-[11px] font-bold opacity-90">Total Income</p>
                <p id="metric-income" class="text-xl font-black">₹0</p>
            </div>
        </div>

        <div id="kitchen-orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const validStaffIDs = ["MCEBB001", "MCEBB002", "MCEBB003", "MCEBB004"];
        const staffPassword = "MCEBB@1960";
        let pollInterval = null;
        let currentTab = 'active'; // 'active' or 'delivered'

        document.addEventListener("DOMContentLoaded", () => {
            const loggedIn = localStorage.getItem('kitchen_logged_in');
            const currentStaff = localStorage.getItem('current_staff_id');

            if (loggedIn === 'true' && validStaffIDs.includes(currentStaff)) {
                showDashboard(currentStaff);
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }

            document.getElementById('staff-login-form').onsubmit = (e) => {
                e.preventDefault();
                const idInput = document.getElementById('staff-id').value.trim().toUpperCase();
                const passInput = document.getElementById('staff-pass').value.trim();

                if (validStaffIDs.includes(idInput) && passInput === staffPassword) {
                    localStorage.setItem('kitchen_logged_in', 'true');
                    localStorage.setItem('current_staff_id', idInput);
                    showDashboard(idInput);
                } else {
                    alert("Invalid Staff ID or Password!");
                }
            };
        });

        function showDashboard(staffId) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';
            document.getElementById('display-staff-id').innerText = staffId;
            fetchOrders();
            clearInterval(pollInterval);
            pollInterval = setInterval(fetchOrders, 4000);
        }

        function staffLogout() {
            localStorage.removeItem('kitchen_logged_in');
            localStorage.removeItem('current_staff_id');
            clearInterval(pollInterval);
            document.getElementById('dashboard-container').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
        }

        function switchTab(tab) {
            currentTab = tab;
            if(tab === 'active') {
                document.getElementById('tab-active-btn').className = "px-4 py-2 bg-amber-500 text-neutral-950 text-xs font-extrabold rounded-xl shadow";
                document.getElementById('tab-delivered-btn').className = "px-4 py-2 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs font-bold rounded-xl transition";
            } else {
                document.getElementById('tab-delivered-btn').className = "px-4 py-2 bg-amber-500 text-neutral-950 text-xs font-extrabold rounded-xl shadow";
                document.getElementById('tab-active-btn').className = "px-4 py-2 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 text-xs font-bold rounded-xl transition";
            }
            fetchOrders();
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                renderKitchenDashboard(orders);
            } catch (e) { console.error("Error fetching orders", e); }
        }

        function renderKitchenDashboard(orders) {
            // Update Metrics
            document.getElementById('metric-total-orders').innerText = orders.length;
            document.getElementById('metric-preparing').innerText = orders.filter(o => o.statusStage === 1).length;
            document.getElementById('metric-ready').innerText = orders.filter(o => o.statusStage === 2).length;
            
            const totalIncome = orders.reduce((sum, ord) => sum + (ord.total || 0), 0);
            document.getElementById('metric-income').innerText = '₹' + totalIncome;

            // Filter orders based on active tab (Delivered orders have statusStage === 3)
            const filteredOrders = orders.filter(o => {
                const stage = o.statusStage || 0;
                if(currentTab === 'delivered') return stage === 3;
                return stage < 3; // Active orders
            });

            const container = document.getElementById('kitchen-orders-list');
            if (filteredOrders.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center py-12 text-neutral-400 text-sm font-medium">No ${currentTab} orders in queue.</p>`;
                return;
            }

            container.innerHTML = filteredOrders.map(ord => {
                const stage = ord.statusStage || 0;
                const isUPI = (ord.payment || "").toLowerCase().includes('upi') || (ord.payment || "").toLowerCase().includes('qr');
                
                // Dynamic card background based on payment method requested
                const cardBgClass = isUPI ? "bg-neutral-900 text-white border-neutral-800" : "bg-white text-neutral-900 border-neutral-200";
                const subTextClass = isUPI ? "text-neutral-400" : "text-neutral-500";
                const itemTextClass = isUPI ? "text-neutral-200" : "text-neutral-700";
                const dividerClass = isUPI ? "border-neutral-800" : "border-neutral-100";

                return `
                <div class="${cardBgClass} border rounded-2xl p-5 space-y-4 shadow-xl transition-all">
                    <div class="flex justify-between items-start border-b ${dividerClass} pb-3">
                        <div>
                            <!-- Order ID Styled Red with Font Size 40 equivalent (text-4xl font-black) -->
                            <h2 class="text-4xl font-black text-red-600 tracking-tight leading-none mb-1">${ord.id}</h2>
                            <h3 class="font-extrabold text-base mt-1">${ord.studentName}</h3>
                            <p class="text-xs ${subTextClass} font-medium mt-0.5">${ord.usn} • Sec ${ord.sec} • ${ord.time}</p>
                        </div>
                        <span class="text-xs font-bold px-3 py-1 rounded-xl ${stage === 3 ? 'bg-purple-100 text-purple-700' : stage === 2 ? 'bg-green-100 text-green-700' : stage === 1 ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-700'}">
                            ${stage === 3 ? 'Delivered' : stage === 2 ? 'Ready' : stage === 1 ? 'Preparing' : 'Received'}
                        </span>
                    </div>

                    <!-- Food items text made big -->
                    <div class="space-y-2 text-sm">
                        ${ord.items.map(i => `<div class="flex justify-between ${itemTextClass} font-semibold"><span>• ${i.name}</span><span class="font-bold">₹${i.price}</span></div>`).join('')}
                    </div>

                    <div class="pt-3 border-t ${dividerClass} flex justify-between items-center">
                        <div>
                            <p class="text-[10px] ${subTextClass} font-bold uppercase tracking-wider">Payment Mode</p>
                            <p class="text-sm font-extrabold">${ord.payment || 'Online UPI / QR'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] ${subTextClass} font-bold uppercase tracking-wider">Amount</p>
                            <p class="text-xl font-black text-amber-500">₹${ord.total}</p>
                        </div>
                    </div>

                    ${stage < 3 ? `
                    <div class="grid grid-cols-3 gap-2 pt-2">
                        <button onclick="updateOrderStatus('${ord.id}', 1)" class="py-2.5 bg-amber-500 hover:bg-amber-400 text-neutral-950 font-extrabold text-xs rounded-xl transition shadow">
                            Preparing
                        </button>
                        <button onclick="updateOrderStatus('${ord.id}', 2)" class="py-2.5 bg-green-600 hover:bg-green-500 text-white font-extrabold text-xs rounded-xl transition shadow">
                            Ready
                        </button>
                        <button onclick="updateOrderStatus('${ord.id}', 3)" class="py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl transition shadow">
                            Delivered
                        </button>
                    </div>` : `
                    <div class="pt-2 text-center text-xs text-neutral-400 font-semibold italic">
                        Order completed and archived to delivered history.
                    </div>`}
                </div>`;
            }).join('');
        }

        async function updateOrderStatus(id, stage) {
            try {
                const res = await fetch(`/api/orders/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statusStage: stage })
                });
                if (res.ok) fetchOrders();
            } catch (e) { alert("Failed to update status"); }
        }
    </script>
</body>
</html>
