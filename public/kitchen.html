<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTEBITES - Kitchen Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-neutral-950 text-white font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-neutral-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-amber-500">MCE Kitchen Dashboard</h1>
                <p class="text-xs text-neutral-400">Live order queue & management</p>
            </div>
            <button onclick="fetchOrders()" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-xs font-bold rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh Queue</span>
            </button>
        </header>

        <div id="kitchen-orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                renderKitchenCards(orders);
            } catch (e) { console.error("Error fetching kitchen queue", e); }
        }

        function renderKitchenCards(orders) {
            const container = document.getElementById('kitchen-orders-list');
            if (orders.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center py-12 text-neutral-500 text-sm">No incoming orders in queue.</p>`;
                return;
            }

            container.innerHTML = orders.map(ord => {
                const stage = ord.statusStage || 0;
                return `
                <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-3">
                    <div class="flex justify-between items-start border-b border-neutral-800 pb-2">
                        <div>
                            <span class="text-xs font-bold text-amber-500">${ord.id}</span>
                            <h3 class="font-bold text-sm">${ord.studentName}</h3>
                            <p class="text-[10px] text-neutral-400">${ord.usn} • Sec ${ord.sec}</p>
                        </div>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${stage === 2 ? 'bg-green-500/10 text-green-500' : stage === 1 ? 'bg-amber-500/10 text-amber-500' : 'bg-blue-500/10 text-blue-500'}">
                            ${stage === 2 ? 'Ready' : stage === 1 ? 'Preparing' : 'Received'}
                        </span>
                    </div>

                    <div class="space-y-1 text-xs">
                        ${ord.items.map(i => `<div class="flex justify-between text-neutral-300"><span>• ${i.name}</span><span>₹${i.price}</span></div>`).join('')}
                    </div>

                    <div class="flex space-x-2 pt-2 border-t border-neutral-800">
                        <button onclick="updateOrderStatus('${ord.id}', 1)" class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl transition">
                            Mark Preparing
                        </button>
                        <button onclick="updateOrderStatus('${ord.id}', 2)" class="flex-1 py-2 bg-green-600 hover:bg-green-500 text-white font-bold text-xs rounded-xl transition">
                            Mark Ready
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function updateOrderStatus(id, stage) {
            try {
                const res = await fetch(`/api/orders/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statusStage: stage })
                });
                if (res.ok) fetchOrders();
            } catch (e) { alert("Failed to update status"); }
        }

        fetchOrders();
        setInterval(fetchOrders, 4000);
    </script>
</body>
</html>
